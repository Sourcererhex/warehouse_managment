<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regístrate</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="register-container">

        <h1>Registrate</h1>

        <div class="orange-line"></div>

        <form id="registerForm">

            <!-- Usuario -->
            <div class="input-row">
                <div class="icon-box">
                    <!-- User icon -->
                    <svg viewBox="0 0 24 24">
                        <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                    </svg>
                </div>

                <input
                    type="text"
                    id="username"
                    placeholder="Usuario"
                    autocomplete="username"
                >
            </div>


            <!-- Contraseña -->
            <div class="input-row">
                <div class="icon-box">
                    <!-- Lock icon -->
                    <svg viewBox="0 0 24 24">
                        <path d="M17 8h-1V6c0-2.21-1.79-4-4-4S8 3.79 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-7-2c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm7 14H7V10h10v10z"/>
                    </svg>
                </div>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    autocomplete="new-password"
                >
            </div>


            <!-- Repetir contraseña -->
            <div class="input-row confirm-row">

                <div class="icon-box">
                    <!-- Lock icon -->
                    <svg viewBox="0 0 24 24">
                        <path d="M17 8h-1V6c0-2.21-1.79-4-4-4S8 3.79 8 6v2H7c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-7-2c0-1.1.9-2 2-2s2 .9 2 2v2h-4V6zm7 14H7V10h10v10z"/>
                    </svg>
                </div>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repita la contraseña"
                    autocomplete="new-password"
                >

                <button type="submit" class="submit-button">
                    →
                </button>

            </div>

            <p id="message"></p>

        </form>

        <div class="login-link">
            <span>¿Ya tienes cuenta ?</span>
            <a href="#">Iniciar Sesión</a>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
